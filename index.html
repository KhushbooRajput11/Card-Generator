<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Genrator</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            background-color: rgb(183, 251, 253);
            color: black;
            overflow: hidden;
        }
        .container{
            height: 100vh;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 50px;
        }
        .data{
            width: 30%;
            display: flex;
            flex-direction: column;
            height:200px;
            background-color: rgb(112, 111, 111);
            padding: 10px;
            border-radius: 10px;
        }
        input{
            width: 100%;
            height: 25%;
            margin: 4px 0px;
            border-radius: 7px;
            padding: 5px ;
            background-color: rgb(245, 242, 239);
        }
        .submit{
            background-color: black;
            color: white;
            width: 30%;
            height: 20%;
            border-radius: 10px;
            align-self: center;
            margin: 5px;
        }
         #output{
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 30px;
        }
        .card{
            width: 200px;
            height: 250px;
           background-color: rgb(170, 195, 241);
            overflow: hidden;
            box-shadow: 2px 5px 5px black;
            border-radius: 10px;
            
            padding: 10px;
        }
        .card img{
            width: 100%;
            height: 100px;
            object-fit: cover;
            border-radius: 10px;
        }
        .card h2,.card p{
            /* -webkit-text-stroke: 0.5px #fff; */
            margin: 10px;

        }
    </style>
</head>
<body>
    <div class="container">
        <div class="data">
            <h1>Create a Card</h1>
            <input type="text" class="title" id="title" placeholder="enter the title">
            <input type="text" class="disc" id="disc" placeholder="enter the discription">
            <input type="url" class="image" id="image" placeholder="enter the link of picture">
            <button class="submit" onclick="createCard()">Click Here</button>
        </div>
        <div id="output"></div>
    </div>
    <script>
        function createCard(){
            let title=document.getElementById("title").value;
            let disc=document.getElementById("disc").value;
            let image=document.getElementById("image").value;
            if(title===""|| disc===""||image===""){
                 alert("Please fill all the fields!");
                return;
            }
             let card = document.createElement("div");
            card.className = "card";

            let img = document.createElement("img");
            img.src = image;
            img.alt = title;
            img.onerror = function () {
                alert("Image link is invalid or the image cannot be loaded.");
                card.remove();
            };
              let heading = document.createElement("h2");
            heading.textContent = title;

            let para = document.createElement("p");
            para.textContent = disc;
            card.appendChild(img);
            card.appendChild(heading);
            card.appendChild(para);
               document.getElementById("output").appendChild(card);

            document.getElementById("title").value = "";
            document.getElementById("desc").value = "";
            document.getElementById("image").value = "";
        }
    </script>
</body>
</html>
